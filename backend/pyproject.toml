[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-research-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["langgraph>=1.0,<2", "httpx>=0.28,<1", "pydantic>=2.10,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "beautifulsoup4>=4.12,<5", "mcp>=1.30,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
research = "app.cli:main"
financial-mcp = "app.mcp.server:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["fixtures/*.json", "evaluation/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
